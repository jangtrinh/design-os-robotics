name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Byte-compile every Python file
        run: python -m compileall -q tools
      - name: Ruff (bug-finding rules only)
        run: |
          python -m pip install --quiet "ruff==0.8.6"
          ruff check --config tools/ci/ruff.toml tools

  smoke:
    timeout-minutes: 15
    name: smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet pillow==13.0.0 pyserial==3.5
      - name: Run tools smoke tests
        run: python tools/ci/smoke.py

  scan:
    timeout-minutes: 20
    name: hygiene scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned scan tools (ripgrep 15.2.0, gitleaks 8.30.1; release tarballs verified by SHA-256)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          RG=ripgrep-15.2.0-x86_64-unknown-linux-musl
          GL=gitleaks_8.30.1_linux_x64
          curl -fsSLO "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/$RG.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$GL.tar.gz"
          printf '%s  %s\n' \
            33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c "$RG.tar.gz" \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$GL.tar.gz" \
            | sha256sum --check --strict
          tar xzf "$RG.tar.gz" --strip-components=1 -C "$HOME/.local/bin" "$RG/rg"
          tar xzf "$GL.tar.gz" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Python scan dependencies
        run: python -m pip install --quiet pillow==13.0.0 rapidocr-onnxruntime==1.4.4 onnxruntime==1.31.1
      - name: Secret scan (gitleaks, working tree, values redacted)
        run: gitleaks dir . --redact --no-banner --exit-code 1
      - name: Run acceptance scan (prints counts only, never matched text)
        run: bash tools/ci/acceptance.sh
