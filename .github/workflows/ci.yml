name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Byte-compile every Python file
        run: python -m compileall -q tools
      - name: Ruff (bug-finding rules only)
        run: |
          python -m pip install --quiet "ruff==0.8.6"
          ruff check --config tools/ci/ruff.toml tools

  smoke:
    timeout-minutes: 15
    name: smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet pillow==13.0.0 pyserial==3.5
      - name: Run tools smoke tests
        run: python tools/ci/smoke.py

  scan:
    timeout-minutes: 20
    name: hygiene scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install scan dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          python -m pip install --quiet pillow==13.0.0 rapidocr-onnxruntime==1.4.4 onnxruntime==1.31.1
      - name: Run acceptance scan (prints counts only, never matched text)
        run: bash tools/ci/acceptance.sh
